name: Aggiorna feed RSS PRETEMP

on:
  workflow_dispatch: {}   # avviato ogni ora da un cron esterno (cron-job.org) via API,
                          # oltre che manualmente da GitHub

concurrency:
  group: build-feed
  cancel-in-progress: false   # accoda le esecuzioni sovrapposte invece di farle
                                # girare in parallelo, evitando conflitti di push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Imposta Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Genera feed RSS
        run: python scraper.py --output docs/rss.xml

      - name: Commit e push se cambiato
        run: |
          git config user.name "pretemp-rss-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/rss.xml
          if git diff --staged --quiet; then
            echo "Nessuna modifica al feed, niente da pushare."
            exit 0
          fi
          git commit -m "Aggiorna feed RSS PRETEMP"
          # Riprova il push fino a 3 volte, riallineandosi al remoto se nel
          # frattempo un'altra esecuzione ha già pushato (dovrebbe essere raro
          # grazie alla 'concurrency' sopra, ma resta come rete di sicurezza).
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push fallito (tentativo $i), riprovo dopo un pull --rebase..."
            git pull --rebase -X theirs origin main
            sleep 3
          done
          echo "Push fallito dopo 3 tentativi."
          exit 1
