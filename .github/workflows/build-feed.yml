name: Aggiorna feed RSS PRETEMP

on:
  workflow_dispatch: {}   # avviato ogni ora da un cron esterno (cron-job.org) via API,
                          # oltre che manualmente da GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Genera feed RSS
        run: python scraper.py --output docs/rss.xml

      - name: Commit e push se cambiato
        run: |
          git config user.name "pretemp-rss-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/rss.xml
          git diff --staged --quiet || git commit -m "Aggiorna feed RSS PRETEMP"
          git push
